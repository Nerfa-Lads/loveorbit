name: loveorbit
description: "Always connected, wherever we are."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.1
  socket_io_client: ^2.0.3
  image_picker: ^1.1.1
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.1.2
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  battery_plus: ^6.0.1
  image_cropper: ^9.1.0
  geocoding: ^3.0.0
  record: ^6.0.0
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
